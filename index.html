<title>@Frisxa ♡</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
:root{--bg1:#ffeaf2;--bg2:#ffc6dc;--dot:#fff;--card:#fff6f9;--line:#ff9bc0;--shade:#ffb5cf;--ink:#c63d77;--sub:#b5557b;--out:#b03d6c;--pk:#ff7fae;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg1:#e0679a;--bg2:#b8447c;--dot:#ffffff40;--out:#fff0f6;--shade:#9c2f66}}
:root[data-theme=dark]{--bg1:#e0679a;--bg2:#b8447c;--dot:#ffffff40;--out:#fff0f6;--shade:#9c2f66}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font:600 16px/1.25 "Baloo 2","Trebuchet MS",system-ui,sans-serif;color:var(--out);min-height:100vh;overflow-x:hidden;background:radial-gradient(90% 45% at 50% 0,#fffa,#fff0),linear-gradient(var(--bg1),var(--bg2)) fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.6;background:radial-gradient(var(--dot) 3px,#0000 3.6px) 0 0/32px 32px,radial-gradient(var(--dot) 3px,#0000 3.6px) 16px 16px/32px 32px}
.fur{fill:var(--b,#ffc9dc);stroke:#ec86a9;stroke-width:2}
main{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:16px 16px 28px;text-align:center}
.top{display:flex;justify-content:space-between}
.ib{width:44px;height:44px;border-radius:50%;border:2.5px dashed var(--line);background:var(--card);color:var(--pk);font:800 20px "Baloo 2",sans-serif;cursor:pointer;box-shadow:0 3px 0 var(--shade);display:grid;place-items:center}
.ib:active{transform:translateY(2px);box-shadow:none}
.hero{position:relative;width:min(100%,270px);margin:-8px auto 0}
.av{width:132px;height:132px;margin:4px auto 12px;border-radius:50%;background:#fff;border:4px solid #fff;outline:3px dashed var(--line);outline-offset:3px;box-shadow:0 8px 0 var(--shade);overflow:hidden;display:grid;place-items:end center;animation:bob 3.4s ease-in-out infinite}
.av svg{width:116px;height:93px}
@keyframes bob{50%{transform:translateY(-6px)}}
h1{font-size:46px;font-weight:800;line-height:1;color:#ff8fb8;-webkit-text-stroke:9px #fff;paint-order:stroke fill;filter:drop-shadow(0 4px 0 var(--shade))}
.bio{margin:12px 0 6px}
.sp{position:absolute;color:#fff;font-style:normal;font-size:22px;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{transform:scale(.4) rotate(40deg);opacity:.4}}
.item{position:relative;margin-top:46px}
.peek{position:absolute;top:-38px;right:58px;width:60px;height:48px;z-index:2;pointer-events:none;filter:drop-shadow(0 2px 0 #fff9)}
.item:nth-child(even) .peek{right:auto;left:58px}
.card{position:relative;isolation:isolate;display:flex;align-items:center;gap:10px;min-height:108px;padding:10px 46px 10px 10px;border-radius:32px;background:var(--card);border:3px dashed var(--line);box-shadow:0 6px 0 var(--shade),0 16px 26px #ff7fa833;color:var(--ink);text-decoration:none;transition:transform .15s cubic-bezier(.3,1.6,.5,1),box-shadow .15s}
.card:hover{transform:translateY(-3px) rotate(-.6deg)}
.card:active{transform:translateY(4px) scale(.98);box-shadow:0 2px 0 var(--shade)}
.card:focus-visible,.ib:focus-visible,.dots:focus-visible{outline:3px solid var(--pk);outline-offset:3px}
.th{flex:0 0 112px;height:90px;border-radius:22px;overflow:hidden;display:block}
.th img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 52%;transform:scale(1.14);mix-blend-mode:multiply}
.tt{flex:1;display:grid;text-align:center}
.tt b{font-size:20px;font-weight:800;line-height:1.1}
.tt small{font-size:13px;color:var(--sub)}
.dots{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:44px;border:0;background:none;color:var(--line);font:800 24px "Baloo 2",sans-serif;cursor:pointer;z-index:3}
.pb{width:132px;height:64px;overflow:hidden;margin:40px auto 0}
.pb svg{width:132px;height:106px}
.ft{display:inline-block;position:relative;top:-6px;padding:6px 18px;border-radius:99px;background:var(--card);color:var(--ink);border:2.5px dashed var(--line);font-size:14px;box-shadow:0 3px 0 var(--shade)}
.fl{position:fixed;bottom:-30px;z-index:0;color:#fff;opacity:0;pointer-events:none;animation:up linear infinite}
.fl:nth-child(3n){color:#ff7fae}
@keyframes up{15%{opacity:.85}to{transform:translateY(-110vh) rotate(50deg);opacity:0}}
.h{position:fixed;z-index:9;pointer-events:none;color:#ff6fa3;transform:translate(-50%,-50%);animation:fly .9s ease-out forwards}
@keyframes fly{to{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(25deg);opacity:0}}
#t{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:10;transform:translate(-50%,30px);opacity:0;pointer-events:none;background:var(--card);color:var(--ink);border:2.5px dashed var(--line);border-radius:99px;padding:8px 18px;box-shadow:0 4px 0 var(--shade);transition:.25s}
#t.on{transform:translate(-50%,0);opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.fl{display:none}}
</style></head>
